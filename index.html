<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ตัวละครจีนมีชีวิต</title>

<script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#fff0f6;
}

.header{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:20;
  background:white;
  padding:15px;
  text-align:center;
  box-shadow:0 3px 12px #0002;
}

.header h1{
  margin:0;
  color:#ff5c91;
  font-size:24px;
}

.header p{
  margin:5px 0 0;
  color:#777;
}

.card{
  position:fixed;
  bottom:12px;
  left:12px;
  right:12px;
  z-index:20;
  background:white;
  border-radius:22px;
  padding:16px;
  text-align:center;
  box-shadow:0 4px 20px #0003;
}

.name{
  font-size:21px;
  font-weight:bold;
}

.chinese{
  font-size:27px;
  font-weight:bold;
  margin-top:8px;
}

.pinyin{
  color:#777;
  margin:5px 0;
}

button{
  border:0;
  border-radius:14px;
  padding:12px 16px;
  margin:5px;
  font-size:15px;
  background:#ff6b9c;
  color:white;
}

.mission{
  margin-top:8px;
  padding:10px;
  background:#fff3aa;
  border-radius:12px;
  font-size:14px;
}

.hint{
  font-size:12px;
  color:#999;
  margin-top:6px;
}
</style>
</head>

<body>

<div class="header">
  <h1>🪄 ตัวละครจีนมีชีวิต</h1>
  <p>AI + AR สื่ออิเล็กทรอนิกส์เพื่อการเรียนภาษาจีน</p>
</div>


<div class="card">

  <div class="name" id="name">
    👩🏻‍🏫 老师 Lǎoshī
  </div>

  <div class="chinese" id="chinese">
    你好！很高兴认识你。
  </div>

  <div class="pinyin" id="pinyin">
    Nǐ hǎo! Hěn gāoxìng rènshi nǐ.
  </div>

  <button onclick="speak()">
    🔊 ฟังเสียงจีน
  </button>

  <button onclick="mission()">
    ⭐ ภารกิจ
  </button>

  <button onclick="nextCharacter()">
    👤 เปลี่ยนตัวละคร
  </button>

  <div class="mission" id="mission">
    ⭐ ภารกิจ: แนะนำตัวเองเป็นภาษาจีน
  </div>

  <div class="hint">
    หมุนมือถือเพื่อดูตัวละคร 3D
  </div>

</div>


<a-scene
  embedded
  vr-mode-ui="enabled:false"
  background="color:#ffeaf3"
  renderer="antialias:true">

  <a-camera
    position="0 1.5 4"
    look-controls="enabled:true">
  </a-camera>


  <!-- พื้น -->

  <a-plane
    position="0 0 -3"
    rotation="-90 0 0"
    width="8"
    height="8"
    color="#f8d9e6">
  </a-plane>


  <!-- ตัวละคร -->

  <a-entity id="character">

    <!-- ตัว -->

    <a-cylinder
      id="body"
      position="0 1 -3"
      radius="0.65"
      height="1.5"
      color="#ff7fa8">
    </a-cylinder>


    <!-- หัว -->

    <a-sphere
      position="0 2.05 -3"
      radius="0.55"
      color="#ffd2b8">
    </a-sphere>


    <!-- ผม -->

    <a-sphere
      position="0 2.35 -3"
      radius="0.57"
      color="#3b2b2b"
      scale="1 0.55 1">
    </a-sphere>


    <!-- ตาซ้าย -->

    <a-sphere
      position="-0.2 2.1 -3.5"
      radius="0.06"
      color="#222">
    </a-sphere>


    <!-- ตาขวา -->

    <a-sphere
      position="0.2 2.1 -3.5"
      radius="0.06"
      color="#222">
    </a-sphere>


    <!-- ปาก -->

    <a-torus
      position="0 1.9 -3.5"
      rotation="90 0 0"
      radius="0.1"
      radius-tubular="0.025"
      color="#d45b75">
    </a-torus>


    <!-- ป้ายชื่อ -->

    <a-text
      id="label"
      value="老师"
      align="center"
      position="0 2.9 -3"
      scale="1.5 1.5 1.5"
      color="#333">
    </a-text>


    <!-- แขนซ้าย -->

    <a-cylinder
      position="-0.8 1 -3"
      radius="0.12"
      height="1.0"
      rotation="0 0 25"
      color="#ffd2b8">
    </a-cylinder>


    <!-- แขนขวา -->

    <a-cylinder
      position="0.8 1 -3"
      radius="0.12"
      height="1.0"
      rotation="0 0 -25"
      color="#ffd2b8">
    </a-cylinder>

  </a-entity>

</a-scene>


<script>

const characters = [

{
name:"👩🏻‍🏫 老师 Lǎoshī",
chinese:"你好！很高兴认识你。",
pinyin:"Nǐ hǎo! Hěn gāoxìng rènshi nǐ.",
mission:"แนะนำตัวเองเป็นภาษาจีน",
color:"#ff7fa8",
label:"老师"
},

{
name:"👨🏻‍🎓 学生 Xuéshēng",
chinese:"你今年几岁？",
pinyin:"Nǐ jīnnián jǐ suì?",
mission:"ตอบอายุของคุณเป็นภาษาจีน",
color:"#6fb7e8",
label:"学生"
},

{
name:"👧🏻 朋友 Péngyǒu",
chinese:"你喜欢什么？",
pinyin:"Nǐ xǐhuān shénme?",
mission:"บอกสิ่งที่คุณชอบเป็นภาษาจีน",
color:"#82d47c",
label:"朋友"
},

{
name:"👨🏻‍⚕️ 医生 Yīshēng",
chinese:"你哪里不舒服？",
pinyin:"Nǐ nǎlǐ bù shūfu?",
mission:"บอกอาการของคุณเป็นภาษาจีน",
color:"#a28de8",
label:"医生"
},

{
name:"👩🏻‍💼 售货员 Shòuhuòyuán",
chinese:"需要帮忙吗？",
pinyin:"Xūyào bāngmáng ma?",
mission:"ขอความช่วยเหลือเป็นภาษาจีน",
color:"#f1a65d",
label:"售货员"
}

];

let current = 0;


function update(){

  const c = characters[current];

  document.getElementById("name").innerText =
    c.name;

  document.getElementById("chinese").innerText =
    c.chinese;

  document.getElementById("pinyin").innerText =
    c.pinyin;

  document.getElementById("mission").innerText =
    "⭐ ภารกิจ: " + c.mission;

  document.getElementById("body")
    .setAttribute("color",c.color);

  document.getElementById("label")
    .setAttribute("value",c.label);

}


function speak(){

  const text =
    characters[current].chinese;

  const speech =
    new SpeechSynthesisUtterance(text);

  speech.lang="zh-CN";
  speech.rate=0.8;

  speechSynthesis.cancel();

  speechSynthesis.speak(speech);

}


function mission(){

  alert(
    "⭐ ภารกิจ\n\n" +
    characters[current].mission +
    "\n\nพูดภาษาจีนให้ครูฟัง!"
  );

}


function nextCharacter(){

  current++;

  if(current >= characters.length){
    current=0;
  }

  update();

}


update();

</script>

</body>
</html>
